<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonar Reply</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#667085; --line:#e4e7ec;
          --accent:#e8590c; --ok:#2b8a3e; --warn:#b26a00; --bad:#c92a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171f; --card:#1c212c; --text:#e7eaf0; --muted:#98a2b3; --line:#2c3342; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); background:var(--card);
           display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header strong { font-size:17px; }
  header a { color:var(--muted); text-decoration:none; }
  header a:hover { color:var(--accent); }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h2 { font-size:16px; margin:24px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:14px; margin-bottom:12px; }
  .muted { color:var(--muted); font-size:13px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px;
           border:1px solid var(--line); margin-right:6px; }
  .badge.ok { color:var(--ok); } .badge.warn { color:var(--warn); } .badge.bad { color:var(--bad); }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  textarea, input[type=text] { width:100%; padding:8px; border-radius:8px; font:inherit;
          border:1px solid var(--line); background:var(--bg); color:var(--text); }
  textarea { min-height:70px; resize:vertical; }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--line); cursor:pointer;
           background:var(--card); color:var(--text); font:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .err { color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  code, pre { font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  a.badge { text-decoration:none; color:inherit; } a.badge.ok { color:var(--ok); font-weight:600; }
  .row a { color:inherit; }
</style>
</head>
<body>
<header>
  <strong>🐾 Sonar Reply</strong>
  <a href="/">Painel</a>
  <a href="/rules">Regras</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
